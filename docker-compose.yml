services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: marketplace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-marketplace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marketplace}
      POSTGRES_DB: ${DB_DATABASE:-marketplace}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-marketplace} -d ${DB_DATABASE:-marketplace}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: marketplace_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: marketplace_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-marketplace}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-marketplace-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  createbuckets:
    image: minio/mc:latest
    container_name: marketplace_createbuckets
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-marketplace}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-marketplace-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-marketplace-local}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set none local/$$MINIO_BUCKET &&
      exit 0
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: marketplace_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
    name: marketplace_postgres_data
  redis_data:
    name: marketplace_redis_data
  minio_data:
    name: marketplace_minio_data
