worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    server {
        listen 80;
        server_name _;

        # Laravel API + health checks — routed to php-fpm. `web/` (the
        # built React SPA) never lives under these prefixes, so this can't
        # shadow a real SPA route.
        location ~ ^/(api|up|health)(/.*)?$ {
            root /var/www/api/public;
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            root /var/www/api/public;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # React SPA — everything else falls through to index.html so
        # client-side routing (AppRouter.tsx) resolves deep links.
        location / {
            root /var/www/web;
            index index.html;
            try_files $uri /index.html;
        }

        location = /favicon.ico { root /var/www/web; log_not_found off; access_log off; }
        location = /robots.txt  { root /var/www/web; log_not_found off; access_log off; }
    }
}
