; SRS §21 production baseline. Overridable per-environment via
; PHP_INI_* env vars is not set up here on purpose — these are fixed
; platform defaults, not per-deploy config (that's .env / secrets manager).
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 192
expose_php = Off
